<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify your account</title>
</head>
<body>
    <h1>Click link below to activate your account</h1>
    <form action="{{.app_base_url}}/verify/" style="display: flex; justify-content: center;" method="post">
        <input type="text" name="user_id" value="{{.id}}" hidden readonly>
        <button type="submit">
            Verify
        </button>
    </form>
</body>
</html>
