<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify your account</title>
</head>
<body>
    <h1>Fill form below to reset your password</h1>
    <form action="{{.app_base_url}}/reset/" style="display: flex; justify-content: center;" method="post">
        <input type="text" name="user_id" value="{{.user_id}}" hidden readonly>
        <input type="text" name="reset_token" value="{{.token}}" hidden readonly>
        <div>
            <label for="new_password">New Password</label>
            <input type="password" name="new_password" placeholder="New Password">
        </div>
        <div>
            <label for="new_password">Confirm New Password</label>
            <input type="password" name="confirm" placeholder="Confirm New Password">
        </div>
        <button type="submit">
            Change
        </button>
    </form>
</body>
</html>
